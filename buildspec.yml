version: 0.2

phases:

  install:
    runtime-versions:
      docker: 20

  pre_build:
    commands:
      - echo Logging into DockerHub
      - docker login -u $DOCKER_USER -p $DOCKER_PASS

  build:
    commands:
      - docker build -t brain-tasks-app .
      - docker tag brain-tasks-app $DOCKER_USER/brain-tasks-app:latest

  post_build:
    commands:
      - docker push $DOCKER_USER/brain-tasks-app:latest
      - kubectl apply -f deployment.yaml
      - kubectl apply -f service.yaml
